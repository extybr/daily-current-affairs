<!DOCTYPE html>
<html>
<body>
    <h3>WebSocket тест (эхо-чат через echo.websocket.org)</h3>
    <input id="msg" placeholder="Напишите что-нибудь">
    <button onclick="sendMsg()">Отправить</button>
    <div id="log" style="border:1px solid #ccc;padding:10px;margin-top:10px;min-height:100px;"></div>
    
    <script>
        const log = document.getElementById('log');
        // Подключаемся к публичному echo-серверу
        const ws = new WebSocket('wss://echo.websocket.org');
        
        ws.onopen = () => log.innerHTML += '✅ Подключено!<br>';
        ws.onmessage = (e) => log.innerHTML += `📩 Получено: ${e.data}<br>`;
        ws.onclose = () => log.innerHTML += '❌ Отключено<br>';
        
        function sendMsg() {
            const msg = document.getElementById('msg').value;
            if (msg) {
                ws.send(msg);
                log.innerHTML += `📤 Отправлено: ${msg}<br>`;
                document.getElementById('msg').value = '';
            }
        }
    </script>
</body>
</html>
